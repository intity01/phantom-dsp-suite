name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name for dry-run packaging (e.g. v0.1.0)"
        required: false
        default: "v0.1.0-dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Package (${{ matrix.target_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            target_name: linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target_name: macos-arm64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.tag || 'v0.1.0-dev' }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux GUI & OpenGL build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-xcb-dev \
            libgl1-mesa-dev \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Phantom EQ and Phantom Launcher (release)
        run: |
          cargo build --release -p phantom-eq
          cargo build --release -p phantom-launcher

      - name: Verify Windows DLL PE exports (GetPluginFactory & clap_entry)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib, struct, sys

          data = pathlib.Path("target/release/phantom_eq.dll").read_bytes()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe + 4] == b"PE\x00\x00", "Invalid PE signature"
          num_sec = struct.unpack_from("<H", data, pe + 6)[0]
          opt_sz = struct.unpack_from("<H", data, pe + 20)[0]
          opt = pe + 24
          magic = struct.unpack_from("<H", data, opt)[0]
          exp_rva = struct.unpack_from("<I", data, opt + (112 if magic == 0x20B else 96))[0]
          assert exp_rva != 0, "Missing PE export directory"
          secs = [struct.unpack_from("<IIII", data, opt + opt_sz + i * 40 + 8) for i in range(num_sec)]
          def rva_to_off(rva):
              for vs, va, rsz, raw in secs:
                  if va <= rva < va + max(vs, rsz):
                      return raw + (rva - va)
              raise ValueError(f"Unmapped RVA: {rva:#x}")
          ed = rva_to_off(exp_rva)
          num_names = struct.unpack_from("<I", data, ed + 24)[0]
          names_off = rva_to_off(struct.unpack_from("<I", data, ed + 32)[0])
          exports = []
          for i in range(num_names):
              off = rva_to_off(struct.unpack_from("<I", data, names_off + i * 4)[0])
              exports.append(data[off:data.index(0, off)].decode("ascii"))
          print("Verified PE exports:", exports)
          missing = [s for s in ("GetPluginFactory", "clap_entry") if s not in exports]
          if missing:
              sys.exit(f"Missing required PE exports: {missing}")
          '@ | python -

      - name: Package Windows release archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "release-stage/phantom-dsp-suite-$version-windows-x86_64"
          $vst3Dir = "$stage/dist/windows/vst3/Phantom EQ.vst3/Contents/x86_64-win"
          $clapDir = "$stage/dist/windows/clap"

          New-Item -ItemType Directory -Force -Path $vst3Dir, $clapDir | Out-Null
          Copy-Item "target/release/phantom_eq.dll" "$vst3Dir/Phantom EQ.vst3"
          Copy-Item "target/release/phantom_eq.dll" "$clapDir/Phantom EQ.clap"
          Copy-Item "target/release/phantom-launcher.exe" "$stage/phantom-launcher.exe"
          Copy-Item "install_to_cubase.ps1", "install_to_cubase.bat", "README.md", "LICENSE-MIT", "LICENSE-APACHE" "$stage/"

          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "release-artifacts/phantom-dsp-suite-$version-windows-x86_64.zip" -Force

      - name: Package Linux release archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="release-stage/phantom-dsp-suite-${VERSION}-linux-x86_64"
          mkdir -p "${STAGE}/dist/linux/Phantom EQ.vst3/Contents/x86_64-linux"
          mkdir -p release-artifacts

          cp target/release/libphantom_eq.so "${STAGE}/dist/linux/Phantom EQ.vst3/Contents/x86_64-linux/Phantom EQ.so"
          cp target/release/libphantom_eq.so "${STAGE}/dist/linux/Phantom EQ.clap"
          cp target/release/phantom-launcher "${STAGE}/phantom-launcher"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE}/"

          tar -C release-stage -czf "release-artifacts/phantom-dsp-suite-${VERSION}-linux-x86_64.tar.gz" "phantom-dsp-suite-${VERSION}-linux-x86_64"

      - name: Package macOS release archive
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PLIST_VER="${VERSION#v}"
          STAGE="release-stage/phantom-dsp-suite-${VERSION}-macos-arm64"
          VST3_BUNDLE="${STAGE}/dist/macos/Phantom EQ.vst3"
          CLAP_BUNDLE="${STAGE}/dist/macos/Phantom EQ.clap"

          mkdir -p "${VST3_BUNDLE}/Contents/MacOS" "${CLAP_BUNDLE}/Contents/MacOS" release-artifacts
          cp target/release/libphantom_eq.dylib "${VST3_BUNDLE}/Contents/MacOS/Phantom EQ"
          cp target/release/libphantom_eq.dylib "${CLAP_BUNDLE}/Contents/MacOS/Phantom EQ"
          printf 'BNDL????' > "${VST3_BUNDLE}/Contents/PkgInfo"
          printf 'BNDL????' > "${CLAP_BUNDLE}/Contents/PkgInfo"

          cat > "${VST3_BUNDLE}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>Phantom EQ</string>
            <key>CFBundleIdentifier</key><string>com.phantom-dsp.phantom-eq.vst3</string>
            <key>CFBundleName</key><string>Phantom EQ</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleShortVersionString</key><string>${PLIST_VER}</string>
            <key>CFBundleVersion</key><string>${PLIST_VER}</string>
          </dict>
          </plist>
          EOF

          cat > "${CLAP_BUNDLE}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>Phantom EQ</string>
            <key>CFBundleIdentifier</key><string>com.phantom-dsp.phantom-eq.clap</string>
            <key>CFBundleName</key><string>Phantom EQ</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleShortVersionString</key><string>${PLIST_VER}</string>
            <key>CFBundleVersion</key><string>${PLIST_VER}</string>
          </dict>
          </plist>
          EOF

          cp target/release/phantom-launcher "${STAGE}/phantom-launcher"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE}/"

          tar -C release-stage -czf "release-artifacts/phantom-dsp-suite-${VERSION}-macos-arm64.tar.gz" "phantom-dsp-suite-${VERSION}-macos-arm64"

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Generate SHA256SUMS & Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Generate SHA256SUMS.txt
        working-directory: dist-release
        run: |
          sha256sum phantom-dsp-suite-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/phantom-dsp-suite-*
            dist-release/SHA256SUMS.txt
