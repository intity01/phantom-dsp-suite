[package]
name = "phantom-vox-studio"
version = "0.1.0"
edition = "2021"
authors = ["Intity01"]
license = "MIT OR Apache-2.0"
description = "Phantom Vox Studio — Standalone Multi-Track Vocal Alignment & Doubling Workstation"

[dependencies]
phantom-vox-dsp = { path = "../../crates/phantom-vox-dsp" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
